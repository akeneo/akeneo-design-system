name: Tag & Publish to npm
on:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: write # push the version tag
  id-token: write # npm trusted publishing (OIDC)
jobs:
  master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
      - name: Create and push tag
        run: |
          V=v$(node .github/workflows/get-version.js)
          git config --global user.email "contact@akeneo.com"
          git config --global user.name "Github Actions"
          if git ls-remote --exit-code --tags origin "$V" >/dev/null; then
            echo "Tag $V already exists, skipping"
          else
            git tag -a "$V" -m "Version ${V#v}" && git push origin "$V"
          fi
      - name: Prepare node to Publish
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm (trusted publishing requires npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install node modules
        run: npm ci
      - name: Publish package to NPM
        run: npm publish --access public
